<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="editor.css" />
    <title>Captura — New Linear issue</title>
  </head>
  <body>
    <div class="app">
      <!-- ============ Left: preview + annotation ============ -->
      <div class="stage">
        <div class="stage-toolbar" id="anno-toolbar">
          <div class="tool-group" id="tools">
            <button class="tool active" data-tool="select" title="Select / move">🖱</button>
            <button class="tool" data-tool="rect" title="Rectangle">▭</button>
            <button class="tool" data-tool="arrow" title="Arrow">↗</button>
            <button class="tool" data-tool="pen" title="Freehand">✏️</button>
            <button class="tool" data-tool="text" title="Text">T</button>
            <button class="tool" data-tool="blur" title="Blur / redact">▩</button>
          </div>
          <div class="tool-group colors" id="colors">
            <button class="swatch active" data-color="#E5484D" style="background:#E5484D"></button>
            <button class="swatch" data-color="#F5A623" style="background:#F5A623"></button>
            <button class="swatch" data-color="#2F9E44" style="background:#2F9E44"></button>
            <button class="swatch" data-color="#5E6AD2" style="background:#5E6AD2"></button>
            <button class="swatch" data-color="#1B1B1F" style="background:#1B1B1F"></button>
          </div>
          <div class="tool-group">
            <button class="tool" id="undo" title="Undo">⟲</button>
            <button class="tool" id="clear" title="Clear annotations">🗑</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="canvas" class="hidden"></canvas>
          <video id="video" class="hidden" controls></video>
          <div id="loading" class="loading">Loading capture…</div>
        </div>

        <!-- Per-screenshot note + thumbnail strip -->
        <div class="caption-bar" id="caption-bar">
          <input
            type="text"
            id="caption"
            placeholder="Describe the issue in this screenshot (optional) — annotations above are saved per screenshot"
          />
        </div>
        <div class="filmstrip-wrap">
          <div class="filmstrip" id="filmstrip"></div>
          <div class="filmstrip-hint" id="filmstrip-hint"></div>
        </div>
      </div>

      <!-- ============ Right: issue form + diagnostics ============ -->
      <aside class="panel">
        <div class="panel-head">
          <img src="icons/icon32.png" width="22" height="22" alt="" />
          <strong>New Linear issue</strong>
          <button id="new-report" class="ghost-btn" title="Start a fresh report — new captures won't be added here">New report</button>
        </div>

        <div id="no-key-warn" class="warn hidden">
          No Linear API key set. <a href="#" id="open-options">Open settings →</a>
        </div>

        <div class="form">
          <label class="field">
            <span>Title <span class="req">*</span></span>
            <input type="text" id="title" placeholder="Short summary of the bug (required)" required />
          </label>

          <label class="field">
            <span>Description (general)</span>
            <textarea id="description" rows="4" placeholder="What happened overall? Steps to reproduce, expected vs. actual… (per-screenshot notes go under each image)"></textarea>
          </label>

          <div class="grid2">
            <label class="field">
              <span>Team</span>
              <select id="team"><option value="">Loading…</option></select>
            </label>
            <label class="field">
              <span>Project</span>
              <select id="project"><option value="">—</option></select>
            </label>
          </div>

          <div class="grid2">
            <label class="field">
              <span>Status</span>
              <select id="state"><option value="">Team default</option></select>
            </label>
            <label class="field">
              <span>Priority</span>
              <select id="priority">
                <option value="0">No priority</option>
                <option value="1">Urgent</option>
                <option value="2">High</option>
                <option value="3">Medium</option>
                <option value="4">Low</option>
              </select>
            </label>
          </div>

          <div class="grid2">
            <label class="field">
              <span>Milestone</span>
              <select id="milestone"><option value="">—</option></select>
            </label>
            <div class="field">
              <span>Assignee</span>
              <div id="assignee" class="ss">
                <input type="text" id="assignee-search" class="ms-input" placeholder="Unassigned" autocomplete="off" />
                <button type="button" id="assignee-clear" class="ss-clear hidden" title="Clear assignee">×</button>
                <div id="assignee-menu" class="ms-menu hidden"></div>
              </div>
            </div>
          </div>

          <div class="field">
            <span>Labels</span>
            <div id="labels" class="ms">
              <div id="labels-selected" class="ms-selected"></div>
              <div class="ms-search">
                <input type="text" id="labels-search" class="ms-input" placeholder="Search labels…" autocomplete="off" />
                <div id="labels-menu" class="ms-menu hidden"></div>
              </div>
            </div>
          </div>

          <label class="checkline">
            <input type="checkbox" id="include-attachment" checked />
            Attach <span id="attach-kind">captures</span> to the issue
          </label>

          <button id="submit" class="primary big">Create issue</button>
          <button id="save-defaults" class="linklike" type="button">↧ Save these selections as my defaults</button>
          <div id="submit-status" class="submit-status"></div>
          <div id="success" class="success hidden"></div>
        </div>

        <!-- Diagnostics accordion -->
        <div class="diag">
          <details id="env-details">
            <summary>Environment <span class="count" id="env-count"></span></summary>
            <div id="env-body" class="diag-body mono"></div>
          </details>
          <details id="console-details">
            <summary>Console <span class="count" id="console-count">0</span></summary>
            <div id="console-body" class="diag-body mono"></div>
          </details>
          <details id="network-details">
            <summary>Network <span class="count" id="network-count">0</span></summary>
            <div id="network-body" class="diag-body mono"></div>
          </details>
        </div>
      </aside>
    </div>

    <!-- floating text editor for the text tool (sized to the box you draw) -->
    <textarea id="text-input" class="text-input hidden" placeholder="Type… · Esc cancels · click away to place"></textarea>

    <script type="module" src="editor.js"></script>
  </body>
</html>
